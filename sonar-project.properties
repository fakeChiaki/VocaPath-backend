sonar.projectKey=Vocapath
sonar.projectName=VocaPath Backend
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src,test,features
sonar.test.inclusions=**/*.spec.ts,test/**/*.ts,features/**/*.ts
sonar.exclusions=**/*.spec.ts,**/node_modules/**,**/migrations/**,**/dist/**,**/coverage/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.ts,src/database/**,src/scraper/run.ts,**/*.spec.ts,test/**,features/**
